<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ioshi · Gashapon da Sorte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sumi:#1c1410; --kinari:#f6ecd8; --shu:#e8862e; --shu-soft:#f6a94e;
    --matcha:#7fa64f; --gold:#f0b84a; --ink:#241c12;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;background:var(--sumi);color:var(--kinari);
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #app{position:relative;min-height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;align-items:center;
    background:
      radial-gradient(circle at 50% 4%, rgba(246,169,78,.16), transparent 44%),
      radial-gradient(circle at 84% 92%, rgba(138,163,90,.08), transparent 46%),
      repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 3px, transparent 3px 24px),
      linear-gradient(180deg,#34251a,var(--sumi) 62%);}
  .noren{width:100%;height:8px;background:var(--shu);}
  .top{width:100%;display:flex;align-items:center;padding:16px;}
  .brand{font-family:'Zen Maru Gothic';font-weight:900;font-size:clamp(15px,2.3vw,20px);}
  .brand b{color:var(--shu-soft);} .brand span{opacity:.55;font-weight:700;font-size:.62em;letter-spacing:.12em;}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:6px 16px 26px;width:100%;}

  /* machine */
  .machine{width:min(78vw,300px);display:flex;flex-direction:column;align-items:center;}
  .dome{width:100%;aspect-ratio:1/0.86;border-radius:50% 50% 44% 44%;position:relative;overflow:hidden;
    background:radial-gradient(circle at 38% 28%, rgba(255,255,255,.5), rgba(210,225,235,.28) 45%, rgba(150,175,190,.3));
    border:3px solid rgba(255,255,255,.5);box-shadow:inset 0 8px 20px rgba(255,255,255,.4),inset 0 -14px 26px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.3);}
  .cap{position:absolute;border-radius:50%;box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),inset 2px 2px 4px rgba(255,255,255,.5);}
  .dome.shake{animation:domeshake .5s ease;}
  @keyframes domeshake{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px) rotate(-1deg);}60%{transform:translateX(4px) rotate(1deg);}}
  .neck{width:82%;background:linear-gradient(180deg,#e8862e,#c96a1e);color:#fff;text-align:center;
    font-family:'Zen Maru Gothic';font-weight:900;letter-spacing:.08em;padding:8px 0;font-size:14px;
    border-left:3px solid #a8571a;border-right:3px solid #a8571a;}
  .body{width:88%;background:linear-gradient(180deg,#d9791f,#a8571a);border-radius:0 0 20px 20px;
    padding:18px 0 22px;display:flex;flex-direction:column;align-items:center;gap:14px;border:3px solid #8f4a16;border-top:none;position:relative;}
  .window{width:64%;height:40px;border-radius:10px;background:rgba(0,0,0,.35);border:2px solid #7a3f12;box-shadow:inset 0 3px 8px rgba(0,0,0,.5);}
  .knob{width:64px;height:64px;border-radius:50%;cursor:pointer;position:relative;
    background:radial-gradient(circle at 38% 32%,#fff5e2,#f0b84a 55%,#c98b1e);border:4px solid #a8571a;
    box-shadow:0 5px 0 #7a3f12,0 8px 12px rgba(0,0,0,.35);transition:transform .1s;display:grid;place-items:center;}
  .knob::before{content:"";width:52%;height:8px;background:#a8571a;border-radius:4px;box-shadow:0 0 0 rgba(0,0,0,0);}
  .knob::after{content:"";position:absolute;width:8px;height:52%;background:#a8571a;border-radius:4px;}
  .knob.spin{animation:spin .6s cubic-bezier(.2,.8,.2,1);}
  @keyframes spin{to{transform:rotate(720deg);}}
  .knob:active{transform:translateY(3px);box-shadow:0 2px 0 #7a3f12,0 5px 8px rgba(0,0,0,.35);}
  .knob:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .slot{width:34%;height:12px;border-radius:8px;background:rgba(0,0,0,.5);box-shadow:inset 0 2px 5px rgba(0,0,0,.6);}

  /* tray + dropped capsule */
  .tray{height:96px;display:flex;align-items:center;justify-content:center;}
  .capsule{width:82px;height:82px;border-radius:50%;position:relative;cursor:pointer;display:none;
    box-shadow:0 8px 14px rgba(0,0,0,.4);}
  .capsule.show{display:block;animation:drop .5s cubic-bezier(.3,1.3,.5,1);}
  @keyframes drop{0%{transform:translateY(-120px) scale(.6);opacity:0;}70%{transform:translateY(6px) scale(1.05);}100%{transform:translateY(0) scale(1);}}
  .capsule .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;transition:transform .35s ease;}
  .capsule .top{top:0;border-radius:41px 41px 6px 6px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));}
  .capsule .bot{bottom:0;border-radius:6px 6px 41px 41px;}
  .capsule .band{position:absolute;top:calc(50% - 3px);left:0;right:0;height:6px;background:rgba(0,0,0,.18);z-index:2;}
  .capsule.open .top{transform:translateY(-40px) rotate(-12deg);}
  .capsule.open .bot{transform:translateY(30px);}
  .capsule .prizeE{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:40px;z-index:3;transition:transform .3s ease .15s;}
  .capsule.open .prizeE{transform:translate(-50%,-50%) scale(1);}
  .hint{font-size:14px;opacity:.75;min-height:1.2em;text-align:center;}

  /* prize card */
  .prize{width:min(88vw,380px);border-radius:20px;padding:20px;text-align:center;display:none;flex-direction:column;gap:8px;align-items:center;
    background:rgba(0,0,0,.34);border:2px solid rgba(246,236,216,.2);box-shadow:0 14px 30px rgba(0,0,0,.4);}
  .prize.on{display:flex;animation:rise .4s ease;}
  @keyframes rise{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .prize .rarity{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;}
  .prize.comum{border-color:rgba(246,236,216,.3);} .prize.comum .rarity{color:#d9cdb4;}
  .prize.raro{border-color:var(--shu);box-shadow:0 0 24px rgba(232,134,46,.35),0 14px 30px rgba(0,0,0,.4);} .prize.raro .rarity{color:var(--shu-soft);}
  .prize.lendario{border-color:var(--gold);box-shadow:0 0 34px rgba(240,184,74,.55),0 14px 30px rgba(0,0,0,.4);} .prize.lendario .rarity{color:var(--gold);}
  .prize .emo{font-size:56px;line-height:1;}
  .prize .title{font-family:'Zen Maru Gothic';font-weight:900;font-size:24px;}
  .prize .desc{font-size:14px;line-height:1.5;opacity:.92;}
  .fineprint{font-size:11px;opacity:.5;text-align:center;max-width:340px;}

  .cta{font-family:'Zen Maru Gothic';font-weight:900;font-size:18px;background:var(--shu);color:#fff;border:none;border-radius:16px;
    padding:14px 30px;cursor:pointer;box-shadow:0 6px 0 #b25e1c,0 10px 18px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s;}
  .cta:active{transform:translateY(3px);box-shadow:0 3px 0 #b25e1c;}
  .cta:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;}.capsule .half,.capsule .prizeE{transition:none;}}
</style>
</head>
<body>
<div id="app">
  <div class="noren"></div>
  <div class="top">
    <a href="index.html" aria-label="Voltar ao menu" style="background:rgba(0,0,0,.28);border:1px solid rgba(243,234,214,.14);color:inherit;border-radius:12px;width:42px;height:42px;font-size:19px;display:grid;place-items:center;text-decoration:none;flex-shrink:0;">←</a><div class="brand"><b>IOSHI</b> · GASHAPON DA SORTE <span>ガシャポン</span></div></div>

  <div class="stage">
    <div class="machine">
      <div class="dome" id="dome"></div>
      <div class="neck">IOSHI ガシャポン</div>
      <div class="body">
        <div class="window"></div>
        <button class="knob" id="knob" aria-label="Girar a cápsula"></button>
        <div class="slot"></div>
      </div>
    </div>

    <div class="tray">
      <div class="capsule" id="capsule">
        <div class="half bot" id="capBot"></div>
        <div class="half top" id="capTop"></div>
        <div class="band"></div>
        <div class="prizeE" id="prizeE"></div>
      </div>
    </div>

    <div class="hint" id="hint">Toque no botão pra girar 🎉</div>

    <div class="prize" id="prize">
      <div class="rarity" id="rarity"></div>
      <div class="emo" id="prizeEmo"></div>
      <div class="title" id="prizeTitle"></div>
      <div class="desc" id="prizeDesc"></div>
      <button class="cta" id="againBtn">Girar de novo</button>
    </div>

    <div class="fineprint">Prêmios e mimos são exemplos — a casa configura a tabela e as regras.</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CAP_COLORS=['#e8862e','#7fa64f','#f0b84a','#f6ecd8','#e0512f','#5f97b0','#d98cae'];

  const PRIZES=[
    // comum (recomendações)
    {e:'🔥',t:'Experimente o Hot Filadélfia',d:'Empanado, quentinho e cremoso — pede uma porção!',r:'comum',w:14,color:'#e0512f'},
    {e:'🌯',t:'Temaki de Salmão',d:'Clássico do balcão, generoso e fresco.',r:'comum',w:14,color:'#e8862e'},
    {e:'🥑',t:'Uramaki Califórnia',d:'Equilíbrio que agrada geral. Boa pedida!',r:'comum',w:14,color:'#7fa64f'},
    {e:'🐟',t:'Sashimi do Dia',d:'Peixe fresco, corte na hora. Puro sabor.',r:'comum',w:12,color:'#5f97b0'},
    {e:'🚤',t:'Barca Combinada',d:'Variedade pra mesa toda dividir.',r:'comum',w:10,color:'#f0b84a'},
    {e:'🍫',t:'Brownie de Sobremesa',d:'Pra fechar com chave de ouro.',r:'comum',w:10,color:'#8a5a2e'},
    // raro (mimos leves)
    {e:'🍵',t:'Chá Verde por conta da casa',d:'Mostre ao garçom no fim da refeição.',r:'raro',w:8,color:'#7fa64f'},
    {e:'🍮',t:'10% na sobremesa',d:'Um docinho com desconto pra adoçar a espera.',r:'raro',w:7,color:'#f0b84a'},
    {e:'🥢',t:'Peça surpresa do balcão',d:'Deixe o itamae escolher algo especial pra você.',r:'raro',w:5,color:'#e8862e'},
    // lendário
    {e:'🎁',t:'Sobremesa grátis!',d:'A sorte sorriu — sobremesa por conta da casa!',r:'lendario',w:2,color:'#f0b84a'},
    {e:'✨',t:'Prato do Itamae',d:'Uma criação especial do chef, só pra você.',r:'lendario',w:1.5,color:'#f0b84a'},
  ];

  const RARITY_LABEL={comum:'Comum',raro:'Raro ✦',lendario:'★ Lendário ★'};

  const dome=$('#dome'), knob=$('#knob'), capsule=$('#capsule'), capTop=$('#capTop'), capBot=$('#capBot'),
        prizeE=$('#prizeE'), hint=$('#hint'), prize=$('#prize'),
        rarity=$('#rarity'), prizeEmo=$('#prizeEmo'), prizeTitle=$('#prizeTitle'), prizeDesc=$('#prizeDesc');

  let state='idle', current=null;

  let ac=null;
  function beep(f,d,type,v){
    try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.value=v||0.05;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d);}catch(e){}}
  function sSpin(){ let f=520; const id=setInterval(()=>{beep(f,0.05,'square',0.04);f-=30;if(f<300)clearInterval(id);},50); }
  const sDrop=()=>beep(300,0.1,'sine',0.06);
  const sOpen=r=>{ if(r==='lendario'){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'triangle',0.08),i*110));}
                   else if(r==='raro'){[600,900].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'triangle',0.07),i*90));}
                   else beep(760,0.1,'triangle',0.06); };

  function fillDome(){
    dome.innerHTML='';
    const n=16;
    for(let i=0;i<n;i++){
      const c=document.createElement('div'); c.className='cap';
      const size=18+Math.random()*16;
      c.style.width=size+'px'; c.style.height=size+'px';
      c.style.left=(6+Math.random()*82)+'%'; c.style.top=(14+Math.random()*74)+'%';
      const col=CAP_COLORS[i%CAP_COLORS.length];
      c.style.background=`radial-gradient(circle at 36% 32%, #fff, ${col} 60%)`;
      dome.appendChild(c);
    }
  }

  function pick(){
    const total=PRIZES.reduce((s,p)=>s+p.w,0);
    let r=Math.random()*total;
    for(const p of PRIZES){ if((r-=p.w)<=0) return p; }
    return PRIZES[0];
  }

  function spin(){
    if(state==='spinning'||state==='dropped') return;
    prize.classList.remove('on');
    capsule.classList.remove('show','open');
    state='spinning';
    hint.textContent='Girando…';
    knob.classList.remove('spin'); void knob.offsetWidth; knob.classList.add('spin');
    if(!reduceMotion){ dome.classList.remove('shake'); void dome.offsetWidth; dome.classList.add('shake'); }
    sSpin();
    setTimeout(()=>{
      current=pick();
      // color capsule halves + prize
      capTop.style.background=`linear-gradient(180deg, rgba(255,255,255,.55), ${current.color})`;
      capBot.style.background=current.color;
      prizeE.textContent=current.e;
      capsule.classList.add('show'); sDrop();
      state='dropped';
      hint.textContent='Toque na cápsula pra abrir 👆';
    }, reduceMotion?200:700);
  }

  function open(){
    if(state!=='dropped') return;
    state='opened';
    capsule.classList.add('open'); sOpen(current.r);
    hint.textContent='';
    setTimeout(()=>{
      prize.className='prize on '+current.r;
      rarity.textContent=RARITY_LABEL[current.r];
      prizeEmo.textContent=current.e; prizeTitle.textContent=current.t; prizeDesc.textContent=current.d;
    }, reduceMotion?60:380);
  }

  function reset(){
    prize.classList.remove('on'); capsule.classList.remove('show','open');
    state='idle'; hint.textContent='Toque no botão pra girar 🎉';
  }

  knob.addEventListener('click',()=>{ try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){} spin(); });
  capsule.addEventListener('pointerdown',e=>{e.preventDefault();open();},{passive:false});
  $('#againBtn').addEventListener('click',()=>{ reset(); spin(); });

  fillDome();
})();
</script>
</body>
</html>
